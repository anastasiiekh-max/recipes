<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рецепты и рацион</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Рецепты">
<meta name="theme-color" content="#F4F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131714" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling content, fixed bottom tab bar; full-screen sheets for recipe, editors and pickers */
:root{
  --bg:#F4F5EF; --surface:#FFFFFF; --surface-2:#E9ECE2; --ink:#1C221D; --muted:#626C5E; --line:#D8DCCF;
  --accent:#9B2356; --accent-ink:#FFFFFF; --accent-soft:#F3E2E9; --herb:#3B6A43; --danger:#B3261E;
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131714; --surface:#1B201C; --surface-2:#262C27; --ink:#ECEFE7; --muted:#A1AA9B; --line:#323933;
  --accent:#E0699A; --accent-ink:#22101A; --accent-soft:#3A2230; --herb:#8EC08F; --danger:#F2867C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131714; --surface:#1B201C; --surface-2:#262C27; --ink:#ECEFE7; --muted:#A1AA9B; --line:#323933;
  --accent:#E0699A; --accent-ink:#22101A; --accent-soft:#3A2230; --herb:#8EC08F; --danger:#F2867C; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.top h1{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.015em;margin:0;text-wrap:balance}
.top h1 small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
main .wrap{padding-block:4px 132px}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:none;outline:none;padding:11px 0;width:100%;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.small{padding:4px 10px;font-size:12.5px}

/* recipe grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px 14px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.ph{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .ini{font-family:var(--display);font-weight:700;font-size:38px;color:var(--muted);opacity:.55}
.ph .star{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--accent);border-radius:999px;width:26px;height:26px;display:grid;place-items:center;font-size:14px}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px}
img.broken{visibility:hidden}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .nm{min-width:0}
.row .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .nm span{color:var(--muted);font-size:13px}
.row .rt{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.row .rt small{display:block;color:var(--muted);font-size:12px}
.th{width:48px;height:48px;border-radius:11px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;position:relative;flex:none}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .ini{font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted)}
.th.sm{width:40px;height:40px;border-radius:9px}

.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 4px;gap:12px}
.group-h h2{font-family:var(--display);font-weight:600;font-size:15px;margin:0;letter-spacing:-.005em}
.group-h span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* empty */
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px}
.empty h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:42ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{color:var(--danger);background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.link{color:var(--accent);font-weight:600}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted);position:relative}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:600;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fab{position:fixed;z-index:31;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(80,10,40,.28)}
@media (min-width:800px){.fab{right:calc(50% - 380px + 16px)}}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bar{position:sticky;top:0;z-index:5;background:var(--bg)}
.sheet-bar .wrap{display:flex;align-items:center;gap:6px;padding-block:8px}
.sheet-bar .sb-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .body{padding-block:4px 120px;display:flex;flex-direction:column;gap:20px}

.hero{width:100%;max-width:100%;aspect-ratio:4/3;max-height:56vh;border-radius:20px;overflow:hidden;background:var(--surface-2);position:relative;display:grid;place-items:center}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ini{font-family:var(--display);font-size:72px;font-weight:700;color:var(--muted);opacity:.45}
.r-title{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px}
.facts b{color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.panel.pad{padding:16px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stepper button{width:38px;height:38px;font-size:20px;line-height:1;color:var(--accent);font-weight:600}
.stepper span{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0 10px;font-variant-numeric:tabular-nums}
.sum b{font-family:var(--display);font-weight:600;font-size:18px}
.sum span{color:var(--muted);font-size:13px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--display);font-weight:600;font-size:14px;width:28px;height:28px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.steps p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sec-h{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 6px}

.check{display:grid;grid-template-columns:24px 40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.check .nm{min-width:0}
.check .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.check .nm span{color:var(--muted);font-size:13px}
.check .rt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.check.done .nm b,.check.done .rt{text-decoration:line-through;color:var(--muted)}
.check.done .th{opacity:.5}

.dish{display:grid;grid-template-columns:40px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish .nm{min-width:0;font-weight:600;overflow-wrap:anywhere;text-align:left}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp,.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-width:0;outline:none}
.inp:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:72px;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{color:var(--muted);font-size:13px;margin:0}
.photo-pick{width:100%;max-width:100%;aspect-ratio:16/10;border:1.5px dashed var(--line);border-radius:18px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:500;position:relative;overflow:hidden}
.photo-pick.sq{aspect-ratio:1/1;max-width:200px;align-self:center}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-tools{display:flex;gap:10px;justify-content:center}
.ing-edit{display:grid;grid-template-columns:40px 1fr auto 32px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ing-edit .nm{min-width:0}
.ing-edit .nm b{display:block;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.ing-edit .nm span{color:var(--muted);font-size:12.5px}
.amt{display:flex;align-items:center;gap:6px}
.amt input{width:76px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:right;outline:none;font-variant-numeric:tabular-nums}
.amt input:focus{border-color:var(--accent)}
.amt span{color:var(--muted);font-size:13px;min-width:34px}
.step-edit{display:grid;grid-template-columns:28px 1fr 32px;gap:10px;align-items:start}
.step-edit .n{font-family:var(--display);font-weight:600;font-size:14px;color:var(--accent);padding-top:11px;text-align:center}
.x{width:32px;height:32px;border-radius:10px;color:var(--muted);font-size:20px;display:grid;place-items:center}
.x:hover{background:var(--surface-2);color:var(--danger)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1}

.set-row{display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:center;padding:6px 0}
.set-row input{background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;outline:none;width:100%;min-width:0}
.set-row input:hover{border-color:var(--line)}
.set-row input:focus{border-color:var(--accent);background:var(--surface)}
.howto ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.howto h3{margin:0;font-size:15px;font-weight:600}
.note{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,14,11,.45);display:grid;place-items:end center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.modal .box{background:var(--surface);border-radius:20px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal .box p{margin:0}
.modal .box .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;z-index:85;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.day{display:flex;flex-direction:column;gap:6px}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.day-h h2{font-family:var(--display);font-weight:600;font-size:15px;margin:0}
.day-h .add{color:var(--accent);font-weight:600;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--accent-soft)}
.meal-tag{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.day .panel .hint{padding:12px 0}
.budget{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.budget b{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;display:block}
.budget span{color:var(--muted);font-size:13px}
.addbtn{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:22px;font-weight:600}
.addbtn.done{background:var(--accent);color:var(--accent-ink);font-size:13px;width:auto;padding:0 10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.row4{grid-template-columns:1fr 1fr}}
.nutr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.nutr b{display:block;font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.nutr div:first-child b{color:var(--accent)}
.nutr span{font-size:11.5px;color:var(--muted)}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.gate .box{max-width:400px;width:100%;display:flex;flex-direction:column;gap:16px}
.gate h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;letter-spacing:-.02em;text-wrap:balance}
.gate p{margin:0;color:var(--muted)}
.code-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code-row code{font-size:16px;font-weight:600;background:var(--surface-2);padding:6px 10px;border-radius:8px;letter-spacing:.06em}
body.gated .top,body.gated .nav,body.gated .fab{display:none!important}
.loading{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="topbar"></div></header>
<main><div class="wrap" id="main"><p class="loading">Открываю книгу рецептов…</p></div></main>
<button class="fab" id="fab" data-act="fab" aria-label="Добавить" hidden>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div id="sheets"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="backupInput" accept="application/json,.json" hidden>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const NF0=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const rub=v=>NF0.format(Math.round(v))+' ₽';
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const coll=new Intl.Collator('ru');
const UNITS=['г','кг','мл','л','шт','уп.','ч. л.','ст. л.','пучок','зубч.'];
const DAYS=[['mon','Понедельник','Пн'],['tue','Вторник','Вт'],['wed','Среда','Ср'],['thu','Четверг','Чт'],['fri','Пятница','Пт'],['sat','Суббота','Сб'],['sun','Воскресенье','Вс']];
const MEALS=[['breakfast','Завтрак'],['lunch','Обед'],['dinner','Ужин'],['snack','Перекус']];
const mealName=id=>(MEALS.find(m=>m[0]===id)||[,''])[1];
const people=()=>Math.max(1,Math.round(num(S.settings.people)||2));
const appName=()=>S.settings.appName||'Семейная книга';
function planEntries(){const out=[];for(const [d] of DAYS)for(const e of (S.plan.days[d]||[]))if(S.recipes.has(e.rid))out.push({...e,day:d});return out}

const nameOf=(list,id)=>(S.settings[list].find(x=>x.id===id)||{}).name;
const initial=s=>esc((String(s||'?').trim()[0]||'?').toUpperCase());
/* photos live in Firestore as data URLs; images render a placeholder until loaded */
const PH='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const photoCache=new Map(),photoLoading=new Set();
const blob=id=>photoCache.get(id)||(PH+'#'+id);
function hydratePhotos(root){
  (root||document).querySelectorAll('img[src^="data:image/gif"]').forEach(img=>{
    const id=img.getAttribute('src').split('#')[1];if(!id)return;
    if(photoCache.has(id)){img.src=photoCache.get(id);return}
    if(photoLoading.has(id)||!S.root)return;photoLoading.add(id);
    S.root.collection('photos').doc(id).get().then(s=>{
      photoLoading.delete(id);const d=s.exists?s.data():null;
      if(!d||!d.data){document.querySelectorAll(`img[src$="#${id}"]`).forEach(i=>i.classList.add('broken'));return}
      photoCache.set(id,d.data);document.querySelectorAll(`img[src$="#${id}"]`).forEach(i=>i.src=d.data);
    }).catch(()=>photoLoading.delete(id));
  });
}
new MutationObserver(()=>hydratePhotos()).observe(document.documentElement,{childList:true,subtree:true});
function thumb(photo,name,cls='th'){return `<div class="${cls}">${photo?`<img src="${blob(photo)}" alt="" loading="lazy">`:`<span class="ini">${initial(name)}</span>`}</div>`}
function fmtAmt(a,unit){return a?`${NF.format(a)} ${esc(unit||'')}`.trim():'по вкусу'}
function priceLine(p){if(p.price==null)return '';return `${rub(p.price)}<small>${p.packSize?`за ${NF.format(p.packSize)} ${esc(p.unit||'')}`:'за упаковку'}</small>`}
function costOf(p,amount){if(!p||p.price==null||!p.packSize||!amount)return null;return amount/p.packSize*p.price}
const MASS={'г':1,'кг':1000,'мл':1,'л':1000};
const NUTR_DEF={'ч. л.':5,'ст. л.':15};
function gramsOf(p,amount){if(!p||!amount)return null;if(MASS[p.unit])return amount*MASS[p.unit];const w=p.unitWeight||NUTR_DEF[p.unit];return w?amount*w:null}
const per100=p=>p&&(p.unit==='мл'||p.unit==='л')?'100 мл':'100 г';
function nutrOf(p,amount){const g=gramsOf(p,amount);if(g==null||p.kcal==null)return null;const k=g/100;return {kcal:p.kcal*k,p:(p.prot||0)*k,f:(p.fat||0)*k,c:(p.carb||0)*k}}
function recipeNutr(r){ // whole recipe as written
  const t={kcal:0,p:0,f:0,c:0,missing:0,known:0};
  for(const i of r.ingredients||[]){const a=num(i.amount);if(!a)continue;const n=nutrOf(S.products.get(i.pid),a);if(!n){t.missing++;continue}t.known++;t.kcal+=n.kcal;t.p+=n.p;t.f+=n.f;t.c+=n.c}
  const sv=r.servings||1;t.per={kcal:t.kcal/sv,p:t.p/sv,f:t.f/sv,c:t.c/sv};return t;
}
const kc=v=>NF0.format(Math.round(v))+' ккал';
function sortedRecipes(){return [...S.recipes.values()].sort((a,b)=>coll.compare(a.title||'',b.title||''))}
function sortedProducts(){return [...S.products.values()].sort((a,b)=>coll.compare(a.name||'',b.name||''))}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2400)}
function safeSet(el,html){const a=document.activeElement;if(a&&el.contains(a)&&a.matches('input,textarea')){el.dataset.stale='1';return}el.innerHTML=html;delete el.dataset.stale}
document.addEventListener('focusout',()=>setTimeout(()=>{if(document.querySelector('[data-stale]'))refresh()},0));
document.addEventListener('error',e=>{if(e.target&&e.target.tagName==='IMG')e.target.classList.add('broken')},true);

let chain=Promise.resolve();
function write(fn,okMsg){
  if(!S.canWrite){toast('У вас доступ только для просмотра');return Promise.resolve(false)}
  const p=chain.then(fn).then(()=>{if(okMsg)toast(okMsg);return true}).catch(err=>{
    const c=err&&err.code;console.warn(err);
    if(c==='permission-denied')toast('База не пускает записи. Проверьте семейный код и правила Firebase.');
    else if(c==='resource-exhausted')toast('Дневной лимит бесплатной базы исчерпан. Попробуйте завтра.');
    else toast('Не получилось сохранить. Проверьте интернет и попробуйте ещё раз.');
    return false});
  chain=p;return p;
}

/* ---------- shopping computation ---------- */
function computeList(entries,extras){
  const items=new Map();
  const get=pid=>{let it=items.get(pid);if(!it){it={pid,amount:0,loose:false,from:[]};items.set(pid,it)}return it};
  for(const e of entries){
    const r=S.recipes.get(e.id);if(!r)continue;
    const base=r.servings||1,f=(e.servings||base)/base;
    for(const ing of r.ingredients||[]){
      if(!ing.pid)continue;
      const it=get(ing.pid);
      const a=num(ing.amount);if(a)it.amount+=a*f;else it.loose=true;
      if(!it.from.includes(r.title))it.from.push(r.title);
    }
  }
  for(const x of extras||[]){
    if(!x.pid)continue;const it=get(x.pid);const a=num(x.amount);
    if(a)it.amount+=a;else it.loose=true;
    if(!it.from.includes('дополнительно'))it.from.push('дополнительно');
  }
  const order=S.settings.stores.map(s=>s.id);
  const groups=new Map();let total=0,buyTotal=0,noPrice=0;
  for(const it of items.values()){
    const p=S.products.get(it.pid);it.p=p;it.cost=costOf(p,it.amount);
    it.packs=p&&p.packSize&&it.amount?Math.ceil(it.amount/p.packSize-1e-9):0;
    it.buy=it.packs&&p.price!=null?it.packs*p.price:null;
    if(it.cost!=null)total+=it.cost;else if(p&&it.amount)noPrice++;
    buyTotal+=it.buy!=null?it.buy:(it.cost||0);
    const sid=p&&p.storeId&&order.includes(p.storeId)?p.storeId:'_none';
    if(!groups.has(sid))groups.set(sid,[]);groups.get(sid).push(it);
  }
  const gl=[...groups.entries()].sort((a,b)=>(a[0]==='_none'?1e9:order.indexOf(a[0]))-(b[0]==='_none'?1e9:order.indexOf(b[0])));
  for(const g of gl)g[1].sort((a,b)=>coll.compare(a.p?.name||'',b.p?.name||''));
  return {groups:gl,total,buyTotal,noPrice,count:items.size};
}
function listHTML(res,checked,scope){
  if(!res.count)return `<p class="hint">${scope==='shop'?'В выбранных блюдах пока нет продуктов из базы.':'В рецепте пока нет продуктов из базы.'}</p>`;
  const shop=scope==='shop';
  const money=i=>shop?(i.buy!=null?i.buy:i.cost):i.cost;
  return res.groups.map(([sid,its])=>{
    const sum=its.reduce((s,i)=>s+(money(i)||0),0);
    return `<div class="group-h"><h2>${sid==='_none'?'Магазин не указан':esc(nameOf('stores',sid))}</h2>${sum?`<span>≈ ${rub(sum)}</span>`:''}</div>
    <div class="panel">${its.map(i=>{
      const p=i.p,done=!!checked[i.pid];
      const amt=i.amount?(shop?'нужно ':'')+fmtAmt(i.amount,p?.unit):'';
      const need=amt+(i.loose&&i.amount?' + по вкусу':'')||(i.loose?'по вкусу':'');
      const packTxt=i.packs&&p.packSize!==1?`купить ${i.packs} уп. по ${NF.format(p.packSize)} ${esc(p.unit)}`:'';
      const sub=[need,packTxt,shop&&i.from.length?esc(i.from.join(', ')):''].filter(Boolean).join(' · ');
      const m=money(i);
      return `<label class="check${done?' done':''}"><input type="checkbox" data-check="${esc(i.pid)}" data-scope="${scope}"${done?' checked':''}>${thumb(p?.photo,p?.name,'th sm')}<div class="nm"><b>${esc(p?.name||'Удалённый продукт')}</b><span>${sub}</span></div><div class="rt">${m!=null?'≈ '+rub(m):''}</div></label>`}).join('')}</div>`}).join('')+
  `<div class="sum"><span>${res.count} ${plural(res.count,'продукт','продукта','продуктов')}${res.noPrice?` · у ${res.noPrice} нет цены`:''}</span><b>≈ ${rub(shop?res.buyTotal:res.total)}</b></div>`;
}

function weekList(){return computeList(planEntries().map(e=>({id:e.rid,servings:e.servings})),(S.plan.extras||[]).filter(x=>S.products.has(x.pid)))}

  const entries=planEntries(),extras=(S.plan.extras||[]).filter(x=>S.products.has(x.pid));
  const res=weekList();
  const days=DAYS.map(([d,full])=>{
    const list=(S.plan.days[d]||[]).filter(e=>S.recipes.has(e.rid)).sort((a,b)=>MEALS.findIndex(m=>m[0]===a.meal)-MEALS.findIndex(m=>m[0]===b.meal));
    const dk=list.reduce((s,e)=>{const n=recipeNutr(S.recipes.get(e.rid));return s+(n.known?n.per.kcal:0)},0);
    return `<div class="day"><div class="day-h"><h2>${full}${dk?`<span class="meal-tag" style="margin-top:2px">≈ ${kc(dk)} на человека</span>`:''}</h2>${S.canWrite?`<button class="add" data-act="plan-add" data-v="${d}">+ Блюдо</button>`:''}</div>
    <div class="panel">${list.length?list.map(e=>{const r=S.recipes.get(e.rid);return `<div class="dish">${thumb(r.photo,r.title,'th sm')}<button class="nm" data-act="open-recipe" data-v="${esc(r.id)}"><span class="meal-tag">${esc(mealName(e.meal))}</span>${esc(r.title)}</button>
      <div class="stepper" title="Порций"><button data-act="plan-serv" data-day="${d}" data-v="${esc(e.id)}" data-d="-1" aria-label="Меньше порций">−</button><span>${e.servings}</span><button data-act="plan-serv" data-day="${d}" data-v="${esc(e.id)}" data-d="1" aria-label="Больше порций">+</button></div>
      <button class="x" data-act="plan-remove" data-day="${d}" data-v="${esc(e.id)}" aria-label="Убрать">×</button></div>`}).join(''):`<p class="hint">Ничего не запланировано</p>`}</div></div>`}).join('');
  return `<div style="display:flex;flex-direction:column;gap:4px;padding-top:4px">

/* ---------- sheets ---------- */
function top(){return S.stack[S.stack.length-1]}
function push(s){S.stack.push(s);renderSheet()}
function pop(){S.stack.pop();renderSheet()}
function renderSheet(){
  const host=$('#sheets');const s=top();
  if(!s){host.innerHTML='';document.body.style.overflow='';return}
  document.body.style.overflow='hidden';
  let html='';
  if(s.type==='recipe')html=sheetRecipe(s);
  else if(s.type==='recipeEdit')html=sheetRecipeEdit(s);
  else if(s.type==='productEdit')html=sheetProductEdit(s);
  else if(s.type==='picker')html=sheetPicker(s);
  else if(s.type==='planPick')html=sheetPlanPick(s);
  else if(s.type==='planTo')html=sheetPlanTo(s);
  const prev=host.firstElementChild;const keep=prev&&prev.dataset.key===s.key?prev.scrollTop:0;
  host.innerHTML=`<div class="sheet" data-key="${s.key}" role="dialog" aria-modal="true">${html}</div>`;
  if(keep)host.firstElementChild.scrollTop=keep;
}
const bar=(title,right='')=>`<div class="sheet-bar"><div class="wrap"><button class="icon-btn" data-act="back" aria-label="Назад">${I.back}</button><div class="sb-title">${esc(title)}</div>${right}</div></div>`;

function cleanupPhotos(d,saved){ // delete uploads that ended up unused
  if(!S.assets)return;
  const keep=saved?d.photo:d._orig;
  const del=new Set(d._new.filter(x=>x!==keep));
  if(saved&&d._orig&&d._orig!==d.photo)del.add(d._orig);
  for(const id of del)S.assets.delete(id).catch(()=>{});
}
function leaveEditor(){const s=top();if(s&&s.draft)cleanupPhotos(s.draft,false);pop()}

async function saveRecipe(){
  const s=top(),d=s.draft;
  if(!d.title.trim()){toast('Напишите название блюда');$('#r-title')?.focus();return}
  const data={title:d.title.trim(),photo:d.photo||null,categoryId:d.categoryId||null,occasionIds:d.occasionIds,servings:Math.max(1,Math.round(num(d.servings)||1)),time:num(d.time)?Math.round(num(d.time)):null,
    ingredients:d.ingredients.filter(i=>i.pid).map(i=>({pid:i.pid,amount:num(i.amount)})),steps:d.steps.map(t=>t.trim()).filter(Boolean),fav:!!d.fav,createdAt:d.createdAt||Date.now(),updatedAt:Date.now()};
  const ref=d.id?S.db.collection('recipes').doc(d.id):S.db.collection('recipes').doc();
  const ok=await write(()=>ref.set(data),d.id?'Рецепт сохранён':'Рецепт добавлен');
  if(!ok)return;
  cleanupPhotos(d,true);
  S.stack.pop();
  const t=top();
  if(t&&t.type==='recipe'){t.servings=data.servings;renderSheet()}
  else{S.stack=[];push({type:'recipe',key:uid(),id:ref.id,servings:data.servings,mode:'ingr',checked:{}})}
}
async function saveProduct(){
  const s=top(),d=s.draft;
  if(!d.name.trim()){toast('Напишите название продукта');$('#p-name')?.focus();return}
  const data={name:d.name.trim(),photo:d.photo||null,storeId:d.storeId||null,unit:d.unit,packSize:num(d.packSize),price:num(d.price),kcal:num(d.kcal),prot:num(d.prot),fat:num(d.fat),carb:num(d.carb),unitWeight:MASS[d.unit]?null:num(d.unitWeight),updatedAt:Date.now()};
  const ref=d.id?S.db.collection('products').doc(d.id):S.db.collection('products').doc();
  const ok=await write(()=>ref.set(data),d.id?'Продукт сохранён':'Продукт добавлен');
  if(!ok)return;
  cleanupPhotos(d,true);
  S.stack.pop();
  const t=top();
  if(t&&t.type==='picker'&&t.mode==='extras'){S.stack.pop();renderSheet();addExtra(ref.id)}
  else if(t&&t.type==='picker'){ // came from recipe editor: add and return
    S.stack.pop();const ed=top();if(ed&&!ed.draft.ingredients.some(i=>i.pid===ref.id))ed.draft.ingredients.push({pid:ref.id,amount:''});
    renderSheet();setTimeout(()=>{const ins=document.querySelectorAll('[data-ing]');ins[ins.length-1]?.focus()},60);

function saveSettings(mut,msg){
  const next=JSON.parse(JSON.stringify(S.settings));mut(next);
  S.settings=next;refresh();
  return write(()=>S.db.doc('app/settings').set(next),msg);
}
function savePlan(mut,msg){
  const next=JSON.parse(JSON.stringify(S.plan));next.days=next.days||{};next.extras=next.extras||[];next.checked=next.checked||{};
  mut(next);S.plan=next;refresh();
  return write(()=>S.db.doc('app/plan').set(next),msg);
}
function addExtra(pid){
  if(!(S.plan.extras||[]).some(x=>x.pid===pid))savePlan(n=>n.extras.push({pid,amount:null}));
  if(S.tab!=='plan'){S.tab='plan';renderTop();renderMain()}
  setTimeout(()=>{const el=document.getElementById('extra-'+pid);if(el){el.focus();el.scrollIntoView({block:'center'})}},80);
}
function addSetting(list,name,then){
  name=(name||'').trim();if(!name)return null;
  if(S.settings[list].some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('Такое название уже есть');return null}
  const id=uid();saveSettings(n=>n[list].push({id,name}),'Добавлено');if(then)then(id);return id;
}

async function handlePhoto(file){
  const s=top();if(!s||!s.draft||!S.assets||!file)return;
  const d=s.draft;d._uploading=true;renderSheet();
  try{
    let res=null;
    for(const [mx,q] of [[1200,.8],[900,.7],[700,.6]]){
      const bl=await shrink(file,mx,q);
      try{res=await S.assets.upload(bl,{type:'image/jpeg'});break}catch(err){if(!err||err.code!=='too_large')throw err}
    }
    if(!res)throw {code:'too_large'};
    d._new.push(res.id);d.photo=res.id;
  }catch(e){
    const c=e&&e.code;
    toast(c==='too_large'?'Фото слишком большое даже после сжатия. Выберите другое.':c==='quota_or_state'?'Место для фото закончилось.':c==='unsupported_type'?'Этот формат не подходит. Выберите JPG или PNG.':'Фото не загрузилось. Попробуйте ещё раз.');
  }finally{d._uploading=false;if(top()===s)renderSheet()}
}
function shrink(file,max=1200,quality=.8){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej({code:'unsupported_type'}),'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej({code:'unsupported_type'})};
    img.src=url;
  });
}

document.addEventListener('input',e=>{

    return;

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='backupInput'){const f=el.files&&el.files[0];if(f)backupLoad(f);return}
  if(el.id==='photoInput'){const f=el.files&&el.files[0];if(f&&S.photoFor===top())handlePhoto(f);return}
  if(el.dataset.check){
    const pid=el.dataset.check;
    if(el.dataset.scope==='shop')savePlan(n=>{if(el.checked)n.checked[pid]=true;else delete n.checked[pid]});
    else{const s=top();if(s){if(el.checked)s.checked[pid]=true;else delete s.checked[pid];renderSheet()}}
    return;
  }
  if(el.dataset.extra){
    const pid=el.dataset.extra,a=num(el.value);const x=(S.plan.extras||[]).find(y=>y.pid===pid);
    if(x&&x.amount!==a)savePlan(n=>{const y=n.extras.find(z=>z.pid===pid);if(y)y.amount=a});
    return;
  }
  if(el.dataset.setfield){
    const f=el.dataset.setfield;let v=el.value.trim();
    if(f==='people'){const n=Math.round(num(v)||0);if(n<1||n>50){el.value=people();toast('Укажите число от 1 до 50');return}v=n}
    if(S.settings[f]!==v)saveSettings(n=>{n[f]=v},'Сохранено').then(()=>renderTop());
    return;
  }
  if(el.dataset.rename){
    const list=el.dataset.rename,id=el.dataset.id,name=el.value.trim();const item=S.settings[list].find(x=>x.id===id);
    if(!item)return;if(!name){el.value=item.name;return}
    if(name!==item.name)saveSettings(n=>{const x=n[list].find(y=>y.id===id);if(x)x.name=name},'Сохранено');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='gate-code'){e.preventDefault();gateGo();return}
  if(e.key==='Enter'&&e.target.dataset.addfield){e.preventDefault();const f=e.target.dataset.addfield;
    if(f==='pe-store')document.querySelector('[data-act="pe-add-store"]').click();else document.querySelector(`[data-act="set-add"][data-list="${f}"]`)?.click()}
  else if(e.key==='Enter'&&(e.target.dataset.rename||e.target.dataset.setfield||e.target.dataset.extra)){e.target.blur()}
  else if(e.key==='Escape'){if(S.modal||$('#modal').innerHTML)closeModal();else if(top()){top().draft?leaveEditor():pop()}}
});

function refresh(){
  renderMain();
  const s=top();
  if(s&&(s.type==='recipe'))renderSheet();
  else if(s&&s.type==='picker'){const pl=$('#pick-list');if(pl)pl.innerHTML=pickList(s)}
  else if(s&&s.type==='planPick'){const pl=$('#pick-list');if(pl)pl.innerHTML=planPickList(s)}
}

};
const SDK=['https://www.gstatic.com/firebasejs/10.12.2/','https://cdn.jsdelivr.net/npm/firebase@10.12.2/'];
const DEFAULT_SETTINGS={appName:'',people:2,stores:[],
  categories:[['breakfast','Завтраки'],['soups','Супы'],['mains','Основные блюда'],['sides','Гарниры'],['salads','Салаты'],['starters','Закуски'],['snacks','Перекусы'],['desserts','Десерты'],['drinks','Напитки'],['sauces','Соусы и заготовки']].map(([id,name])=>({id,name})),
  occasions:[['newyear','Новый год'],['easter','Пасха'],['birthday','День рождения'],['march8','8 Марта'],['maslenitsa','Масленица'],['picnic','Пикник']].map(([id,name])=>({id,name}))};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function loadFirebase(){
  for(const base of SDK){try{
    if(!window.firebase)await loadScript(base+'firebase-app-compat.js');
    if(!(window.firebase&&firebase.firestore))await loadScript(base+'firebase-firestore-compat.js');
    if(window.firebase&&firebase.firestore)return true}catch(_){}}
  return false;
}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}};
const normCode=c=>String(c||'').trim().toLowerCase().replace(/\s+/g,'');

function showGate(msg,pending){
  document.body.classList.add('gated');S.gatePending=pending||null;
  $('#main').innerHTML=`<div class="gate"><div class="box">
    <h1>Рецепты и рацион</h1>
    ${pending?`<p>Книги рецептов с кодом <b>${esc(pending)}</b> ещё нет. Создать новую? Если вы хотели открыть уже существующую, проверьте код.</p>
      <button class="btn primary" data-act="gate-create">Создать новую книгу</button><button class="btn ghost" data-act="gate-back">Ввести другой код</button>`
    :`<p>Введите семейный код. Его знает тот, кто прислал вам ссылку.</p>
    <label class="field"><span>Семейный код</span><input id="gate-code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Не короче 6 символов"></label>
    ${msg?`<p style="color:var(--danger)">${esc(msg)}</p>`:''}
    <button class="btn primary" data-act="gate-go">Открыть</button>`}
  </div></div>`;
  setTimeout(()=>$('#gate-code')?.focus(),50);
}
async function gateGo(){
  const code=normCode($('#gate-code')?.value);
  if(code.length<6){showGate('Код должен быть не короче 6 символов.');return}
  if(/[\/.]/.test(code)){showGate('В коде нельзя использовать точку и косую черту.');return}
  const btn=document.querySelector('[data-act="gate-go"]');if(btn){btn.disabled=true;btn.textContent='Проверяю…'}
  try{
    const s=await S.fs.collection('families').doc(code).collection('app').doc('settings').get({source:'server'});
    if(s.exists){lsSet('familyCode',code);start(code)}else showGate(null,code);
  }catch(e){console.warn(e);showGate(e&&e.code==='permission-denied'?'База не пустила. Проверьте, что правила Firebase опубликованы.':'Нет связи с базой. Проверьте интернет и попробуйте ещё раз.')}
}
async function gateCreate(){
  const code=S.gatePending;if(!code)return;
  try{await S.fs.collection('families').doc(code).collection('app').doc('settings').set(DEFAULT_SETTINGS);lsSet('familyCode',code);start(code)}
  catch(e){console.warn(e);showGate('Не получилось создать книгу. Проверьте интернет и правила Firebase.')}
}
function readDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
function start(code){
  document.body.classList.remove('gated');
  S.code=code;const root=S.root=S.fs.collection('families').doc(code);
  S.db={doc:p=>{const [c,d]=p.split('/');return root.collection(c).doc(d)},collection:p=>root.collection(p)};
  S.assets={
    upload:async b=>{let data=await readDataURL(b);if(data.length>900000)throw {code:'too_large'};
      const ref=root.collection('photos').doc();await ref.set({data,createdAt:Date.now()});photoCache.set(ref.id,data);return {id:ref.id}},
    delete:id=>root.collection('photos').doc(id).delete()
  };
  S.loaded={s:false,p:false,r:false,plan:false};
  renderTop();renderNav();renderMain();
  const onErr=e=>{console.warn(e);if(e&&e.code==='permission-denied'){S.failed='База не пускает по этому коду. Выйдите в настройках и введите код заново.';renderMain()}else toast('Связь с базой прервалась. Обновите страницу.')};
  S.db.doc('app/settings').onSnapshot(s=>{const d=s.exists?s.data():{};S.settings={categories:d.categories||[],occasions:d.occasions||[],stores:d.stores||[],appName:d.appName||'',people:d.people||2};S.loaded.s=true;if(S.tab==='recipes'&&!document.activeElement?.matches('#q-recipes')){const h=$('#topbar h1 small');if(h)h.textContent=appName()}refresh()},onErr);
  S.db.collection('products').onSnapshot(q=>{S.products=new Map(q.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.loaded.p=true;refresh()},onErr);
  S.db.collection('recipes').onSnapshot(q=>{S.recipes=new Map(q.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.loaded.r=true;refresh()},onErr);
  S.db.doc('app/plan').onSnapshot(s=>{const d=s.exists?s.data():{};S.plan=JSON.parse(JSON.stringify({days:d.days||{},extras:d.extras||[],checked:d.checked||{}}));S.loaded.plan=true;refresh()},onErr);
}

/* ---------- backup ---------- */
async function backupSave(){
  S.busy='save';renderMain();
  try{
    const photos={};
    const ids=new Set([...S.products.values(),...S.recipes.values()].map(x=>x.photo).filter(Boolean));
    for(const id of ids){if(photoCache.has(id)){photos[id]=photoCache.get(id);continue}
      const s=await S.root.collection('photos').doc(id).get();if(s.exists&&s.data().data)photos[id]=s.data().data}
    const data={app:'recipes-family',version:1,savedAt:new Date().toISOString(),settings:S.settings,plan:S.plan,products:[...S.products.values()],recipes:[...S.recipes.values()],photos};
    const b=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='recepty-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  }catch(e){console.warn(e);toast('Не получилось собрать копию. Проверьте интернет.')}
  finally{S.busy=null;renderMain()}
}
async function backupLoad(file){
  S.busy='load';renderMain();
  try{
    let d;try{d=JSON.parse(await file.text())}catch(_){throw new Error('format')}
    if(!d||d.app!=='recipes-family')throw new Error('format');
    const ops=[];
    for(const [id,data] of Object.entries(d.photos||{}))ops.push(['photos',id,{data,createdAt:Date.now()}]);
    for(const p of d.products||[]){const {id,...rest}=p;if(id)ops.push(['products',id,rest])}
    for(const r of d.recipes||[]){const {id,...rest}=r;if(id)ops.push(['recipes',id,rest])}
    if(d.settings){const cur=S.settings;const merge=(a,b)=>{const m=new Map((a||[]).map(x=>[x.id,x]));for(const x of b||[])if(x&&x.id&&!m.has(x.id))m.set(x.id,x);return [...m.values()]};
      ops.push(['app','settings',{categories:merge(cur.categories,d.settings.categories),occasions:merge(cur.occasions,d.settings.occasions),stores:merge(cur.stores,d.settings.stores),appName:cur.appName||d.settings.appName||'',people:cur.people||d.settings.people||2}])}
    let batch=S.fs.batch(),n=0,size=0;
    for(const [c,id,data] of ops){const len=JSON.stringify(data).length;
      if(n&&(n>=400||size+len>7e6)){await batch.commit();batch=S.fs.batch();n=0;size=0}
      batch.set(S.root.collection(c).doc(id),data);n++;size+=len}
    if(n)await batch.commit();
    for(const [id,data] of Object.entries(d.photos||{}))photoCache.set(id,data);
    const rn=(d.recipes||[]).length,pn=(d.products||[]).length;
    toast(`Загружено: ${rn} ${plural(rn,'рецепт','рецепта','рецептов')}, ${pn} ${plural(pn,'продукт','продукта','продуктов')}`);
  }catch(e){console.warn(e);toast(e&&e.message==='format'?'Это не файл резервной копии':'Не получилось загрузить файл. Проверьте интернет.')}
  finally{S.busy=null;renderMain()}
}

/* ---------- boot ---------- */
renderTop();renderNav();
(async function boot(){
  if(!FIREBASE_CONFIG){S.failed='Приложение ещё не подключено к базе данных.';renderMain();return}
  if(!(await loadFirebase())){S.failed='Не загрузились файлы базы данных. Проверьте интернет и обновите страницу.';renderMain();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore();
  try{fs.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(_){}
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(_){}
  S.fs=fs;
  const code=normCode(lsGet('familyCode'));
  if(code.length>=6)start(code);else showGate();
})();
})();
